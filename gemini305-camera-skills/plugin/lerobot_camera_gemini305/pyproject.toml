[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
# LeRobot 0.6.0 のプラグイン発見はエントリポイントではなく、
# 「lerobot_camera_ で始まる配布名を importlib.import_module する」方式。
# したがって配布名 = トップレベルパッケージ名 (アンダースコア維持) が必須。
name = "lerobot_camera_gemini305"
version = "0.1.0"
description = "Orbbec Gemini 305 stereo depth camera plugin for LeRobot 0.6.x (pyorbbecsdk v2)"
requires-python = ">=3.10"
dependencies = [
    "lerobot>=0.6.0",
    "numpy",
    "opencv-python",
    # PyPI の "pyorbbecsdk" は v1 系 (x86_64 のみ) なので使わないこと。
    # v2 系は "pyorbbecsdk2" (manylinux aarch64 / cp38-cp313 ホイールあり)。
    "pyorbbecsdk2>=2.0.15",
]
# 注意 (Jetson): 既存の CUDA torch/numpy スタックを守るため
#   pip install -e . --no-deps && pip install pyorbbecsdk2 --no-deps
# でインストールすること。

[project.scripts]
lerobot-gemini305-monitor = "lerobot_camera_gemini305.monitor:main"

[tool.setuptools.packages.find]
include = ["lerobot_camera_gemini305*"]
